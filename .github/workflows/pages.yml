name: Build and deploy web

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  delete:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.event_name != 'delete' &&
      (github.event_name != 'pull_request' || github.event.action != 'closed')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Odin
        uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release: dev-2026-07a

      - name: Set up Emscripten
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: 6.0.5

      - name: Build web application
        run: ./build.sh release web

      - name: Deploy production
        if: github.event_name != 'pull_request' && github.ref_name == 'main'
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4
        with:
          branch: gh-pages
          folder: build/web
          clean: false

      - name: Deploy preview
        if: >-
          (github.event_name == 'pull_request' &&
           github.event.pull_request.head.repo.full_name == github.repository) ||
          (github.event_name != 'pull_request' && github.ref_name != 'main')
        uses: rajyan/preview-pages@4fdab7d665d506f4dd2092bc9897ef707888071a # v1.3.37
        with:
          source-dir: build/web
          pr-per-commit: false
          pr-comment: sticky
          branch-per-commit: false
          branch-comment: none

  clean-up:
    if: >-
      (github.event_name == 'pull_request' && github.event.action == 'closed') ||
      (github.event_name == 'delete' && github.event.ref_type == 'branch' && github.event.ref != 'main')
    runs-on: ubuntu-latest
    env:
      PREVIEW_DIR: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || github.event.ref }}
    steps:
      - name: Checkout published site
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Remove preview
        run: |
          rm -rf -- "$PREVIEW_DIR"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --all
          if ! git diff --cached --quiet; then
            git commit -m "Remove preview for $PREVIEW_DIR"
            git push
          fi
