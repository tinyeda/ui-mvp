<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
	<meta name="title" content="TinyEDA">
	<meta name="description" content="TinyEDA studio UI">
	<link rel="icon" href="data:,">
	<title>TinyEDA</title>
	<style>
		html, body {
			width: 100%;
			height: 100%;
			margin: 0;
			overflow: hidden;
			overscroll-behavior: none;
			background: #14161a;
		}
		canvas {
			display: block;
			width: 100%;
			height: 100%;
			border: 0;
			touch-action: none;
			user-select: none;
			-webkit-user-select: none;
		}
	</style>
</head>
<body>
	<canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()" onmousedown="event.target.focus()"></canvas>
	<script src="odin.js"></script>
	<script>
		const odinMemoryInterface = new odin.WasmMemoryInterface();
		odinMemoryInterface.setIntSize(4);
		const odinImports = odin.setupDefaultImports(odinMemoryInterface);
		const fileInput = document.createElement("input");
		fileInput.type = "file";
		fileInput.multiple = true;
		fileInput.hidden = true;
		document.body.appendChild(fileInput);
		const mobileTextInput = document.createElement("textarea");
		mobileTextInput.setAttribute("autocapitalize", "off");
		mobileTextInput.setAttribute("autocomplete", "off");
		mobileTextInput.setAttribute("inputmode", "text");
		mobileTextInput.setAttribute("spellcheck", "false");
		mobileTextInput.style.cssText = "position:fixed;left:-10000px;top:0;width:1px;height:1px;font-size:16px;opacity:0;pointer-events:none";
		document.body.appendChild(mobileTextInput);
		// Emscripten's GLFW backend listens for keyboard events on window in
		// capture phase. When the textarea owns mobile text input, prevent GLFW
		// from also forwarding the same keystroke through GetCharPressed().
		for (const eventName of ["keydown", "keypress", "keyup"]) {
			window.addEventListener(eventName, (event) => {
				if (document.activeElement === mobileTextInput) event.stopImmediatePropagation();
			}, true);
		}
		const hasMobileKeyboard = navigator.maxTouchPoints > 0 && matchMedia("(pointer: coarse)").matches;
		const fileHandles = new Map();
		const pathHandles = new Map();
		let nextFileHandle = 1;
		const importBatchFileLimit = 250;
		const importBatchByteLimit = 16 * 1024 * 1024;
		const projectDatabase = new Promise((resolve, reject) => {
			const request = indexedDB.open("tinyeda-projects", 1);
			request.onupgradeneeded = () => request.result.createObjectStore("files", {keyPath: "path"});
			request.onsuccess = () => resolve(request.result);
			request.onerror = () => reject(request.error);
		});
		const storeProjectFiles = async (records) => {
			const database = await projectDatabase;
			await new Promise((resolve, reject) => {
				const transaction = database.transaction("files", "readwrite");
				const store = transaction.objectStore("files");
				for (const record of records) store.put(record);
				transaction.oncomplete = resolve;
				transaction.onerror = () => reject(transaction.error);
				transaction.onabort = () => reject(transaction.error);
			});
		};
		const storeProjectFile = (path, contents) => storeProjectFiles([{path, contents}]);
		const registerProjectFile = (path, contents) => {
			const encoder = new TextEncoder();
			const encodedPath = encoder.encode(path);
			const handle = pathHandles.get(path) ?? nextFileHandle++;
			pathHandles.set(path, handle);
			fileHandles.set(handle, contents);
			const ptr = wasmExports.web_transfer_alloc(encodedPath.length);
			new Uint8Array(wasmExports.memory.buffer, ptr, encodedPath.length).set(encodedPath);
			wasmExports.web_register_file(ptr, encodedPath.length, BigInt(handle), BigInt(contents.size));
		};
		const restoreProjectFiles = async () => {
			try {
				const database = await projectDatabase;
				const records = await new Promise((resolve, reject) => {
					const request = database.transaction("files").objectStore("files").getAll();
					request.onsuccess = () => resolve(request.result);
					request.onerror = () => reject(request.error);
				});
				for (const {path, contents} of records) registerProjectFile(path, contents);
				wasmExports.web_transfer_finished();
			} catch (error) {
				console.error("TinyEDA project restore failed", error);
			}
		};
		const crc32Table = (() => {
			const table = new Uint32Array(256);
			for (let index = 0; index < table.length; index++) {
				let value = index;
				for (let bit = 0; bit < 8; bit++) {
					value = (value >>> 1) ^ ((value & 1) ? 0xedb88320 : 0);
				}
				table[index] = value >>> 0;
			}
			return table;
		})();
		const crc32 = (bytes) => {
			let value = 0xffffffff;
			for (const byte of bytes) value = crc32Table[(value ^ byte) & 0xff] ^ (value >>> 8);
			return (value ^ 0xffffffff) >>> 0;
		};
		const createProjectZip = async (records) => {
			const localParts = [];
			const centralParts = [];
			let localOffset = 0;
			for (const {path, contents} of records) {
				const name = textEncoder.encode(path.replace(/^\/+/, ""));
				const data = new Uint8Array(await contents.arrayBuffer());
				if (name.length > 0xffff || data.length > 0xffffffff || localOffset > 0xffffffff) {
					throw new Error("Project is too large for ZIP export");
				}
				const checksum = crc32(data);
				const localHeader = new Uint8Array(30 + name.length);
				const localView = new DataView(localHeader.buffer);
				localView.setUint32(0, 0x04034b50, true);
				localView.setUint16(4, 20, true);
				localView.setUint16(6, 0x0800, true);
				localView.setUint32(14, checksum, true);
				localView.setUint32(18, data.length, true);
				localView.setUint32(22, data.length, true);
				localView.setUint16(26, name.length, true);
				localHeader.set(name, 30);

				const centralHeader = new Uint8Array(46 + name.length);
				const centralView = new DataView(centralHeader.buffer);
				centralView.setUint32(0, 0x02014b50, true);
				centralView.setUint16(4, 20, true);
				centralView.setUint16(6, 20, true);
				centralView.setUint16(8, 0x0800, true);
				centralView.setUint32(16, checksum, true);
				centralView.setUint32(20, data.length, true);
				centralView.setUint32(24, data.length, true);
				centralView.setUint16(28, name.length, true);
				centralView.setUint32(42, localOffset, true);
				centralHeader.set(name, 46);

				localParts.push(localHeader, data);
				centralParts.push(centralHeader);
				localOffset += localHeader.length + data.length;
			}
			if (records.length > 0xffff) throw new Error("Project has too many files for ZIP export");
			const centralSize = centralParts.reduce((size, part) => size + part.length, 0);
			const end = new Uint8Array(22);
			const endView = new DataView(end.buffer);
			endView.setUint32(0, 0x06054b50, true);
			endView.setUint16(8, records.length, true);
			endView.setUint16(10, records.length, true);
			endView.setUint32(12, centralSize, true);
			endView.setUint32(16, localOffset, true);
			return new Blob([...localParts, ...centralParts, end], {type: "application/zip"});
		};
		const webExportProject = () => {
			void (async () => {
				try {
					const database = await projectDatabase;
					const records = await new Promise((resolve, reject) => {
						const request = database.transaction("files").objectStore("files").getAll();
						request.onsuccess = () => resolve(request.result);
						request.onerror = () => reject(request.error);
					});
					const zip = await createProjectZip(records);
					const link = document.createElement("a");
					const url = URL.createObjectURL(zip);
					link.href = url;
					link.download = "tinyeda-project.zip";
					link.click();
					setTimeout(() => URL.revokeObjectURL(url), 60000);
				} catch (error) {
					console.error("TinyEDA project export failed", error);
				}
			})();
		};
		fileInput.addEventListener("change", async () => {
			const files = Array.from(fileInput.files, (file) => ({
				path: file.webkitRelativePath || file.name,
				contents: file,
			}));
			for (let start = 0; start < files.length;) {
				let end = start;
				let batchBytes = 0;
				while (end < files.length && end - start < importBatchFileLimit) {
					const nextSize = files[end].contents.size;
					if (end > start && batchBytes + nextSize > importBatchByteLimit) break;
					batchBytes += nextSize;
					end++;
				}
				const batch = files.slice(start, end);
				try {
					await storeProjectFiles(batch);
					for (const {path, contents} of batch) registerProjectFile(path, contents);
				} catch (error) {
					console.error("TinyEDA project import failed", error);
				}
				start = end;
				await new Promise((resolve) => requestAnimationFrame(resolve));
			}
			wasmExports.web_transfer_finished();
			fileInput.value = "";
		});
		const webPickFiles = (folder) => {
			if (folder !== 0) fileInput.setAttribute("webkitdirectory", "");
			else fileInput.removeAttribute("webkitdirectory");
			fileInput.click();
		};
		const webReadFile = (handle, offset, length, requestId) => {
			void (async () => {
				let ptr = 0;
				let allocatedLength = 0;
				let success = 0;
				try {
					const file = fileHandles.get(Number(handle));
					const start = Number(offset);
					if (!file || !Number.isSafeInteger(start) || start < 0) throw new Error("Invalid file read");
					const end = Math.min(start + Number(length), file.size);
					const contents = new Uint8Array(await file.slice(start, end).arrayBuffer());
					allocatedLength = contents.length;
					ptr = wasmExports.web_read_alloc(allocatedLength);
					if (allocatedLength > 0 && ptr === 0) throw new Error("WASM file read allocation failed");
					new Uint8Array(wasmExports.memory.buffer, ptr, contents.length).set(contents);
					success = 1;
				} catch (error) {
					console.error("TinyEDA file read failed", error);
				}
				wasmExports.web_read_completed(requestId, ptr, ptr === 0 ? 0 : allocatedLength, success);
			})();
		};
		const webWriteFile = (pathPtr, pathLength, dataPtr, dataLength, requestId) => {
			const path = textDecoder.decode(new Uint8Array(wasmExports.memory.buffer, pathPtr, pathLength));
			const contents = new Blob([new Uint8Array(wasmExports.memory.buffer, dataPtr, dataLength).slice()]);
			const handle = pathHandles.get(path) ?? nextFileHandle++;
			pathHandles.set(path, handle);
			fileHandles.set(handle, contents);
			void (async () => {
				let success = 0;
				try {
					await storeProjectFile(path.replace(/^\/workspace\//, ""), contents);
					success = 1;
				} catch (error) {
					console.error("TinyEDA project save failed", error);
				}
				const encodedPath = textEncoder.encode(path.replace(/^\/workspace\//, ""));
				const ptr = wasmExports.web_transfer_alloc(encodedPath.length);
				new Uint8Array(wasmExports.memory.buffer, ptr, encodedPath.length).set(encodedPath);
				wasmExports.web_write_completed(requestId, ptr, encodedPath.length, BigInt(handle), BigInt(contents.size), success);
			})();
		};
		const webSetClipboardText = (dataPtr, dataLength) => {
			const text = textDecoder.decode(new Uint8Array(wasmExports.memory.buffer, dataPtr, dataLength));
			if (navigator.clipboard?.writeText) {
				void navigator.clipboard.writeText(text).catch((error) => {
					console.warn("TinyEDA clipboard write failed", error);
				});
			}
		};
		const workspaceStorageKeys = ["tinyeda.workspace.v1", "tinyeda.imgui.v1"];
		const textEncoder = new TextEncoder();
		const textDecoder = new TextDecoder();
		const webStorageBytes = (kind) => {
			try {
				const value = localStorage.getItem(workspaceStorageKeys[kind]);
				return value === null ? null : textEncoder.encode(value);
			} catch (error) {
				console.error("TinyEDA workspace load failed", error);
				return null;
			}
		};
		const webStorageSize = (kind) => webStorageBytes(kind)?.length ?? -1;
		const webStorageLoad = (kind, ptr, capacity) => {
			const data = webStorageBytes(kind);
			if (data === null || data.length !== capacity) return -1;
			new Uint8Array(wasmExports.memory.buffer, ptr, capacity).set(data);
			return capacity;
		};
		const webStorageSave = (kind, ptr, size) => {
			try {
				const data = new Uint8Array(wasmExports.memory.buffer, ptr, size);
				localStorage.setItem(workspaceStorageKeys[kind], textDecoder.decode(data));
				return 1;
			} catch (error) {
				console.error("TinyEDA workspace save failed", error);
				return 0;
			}
		};

		var Module = {
			instantiateWasm: (imports, successCallback) => {
				imports.env.web_pick_files = webPickFiles;
				imports.env.web_read_file = webReadFile;
				imports.env.web_write_file = webWriteFile;
				imports.env.web_export_project = webExportProject;
				imports.env.web_set_clipboard_text = webSetClipboardText;
				imports.env.web_storage_size = webStorageSize;
				imports.env.web_storage_load = webStorageLoad;
				imports.env.web_storage_save = webStorageSave;
				const mergedImports = {...odinImports, ...imports};
				return WebAssembly.instantiateStreaming(fetch("index.wasm"), mergedImports).then((output) => {
					const exports = output.instance.exports;
					odinMemoryInterface.setExports(exports);
					odinMemoryInterface.setMemory(exports.memory);
					return successCallback(output.instance);
				});
			},
			onRuntimeInitialized: () => {
				const exports = wasmExports;
				const canvas = document.getElementById("canvas");
				const sendMobileText = (text) => {
					if (!text) return;
					const data = textEncoder.encode(text);
					const ptr = exports.web_transfer_alloc(data.length + 1);
					if (ptr === 0) return;
					const destination = new Uint8Array(exports.memory.buffer, ptr, data.length + 1);
					destination.set(data);
					destination[data.length] = 0;
					exports.web_text_input(ptr);
				};
				mobileTextInput.addEventListener("beforeinput", (event) => {
					switch (event.inputType) {
					case "deleteContentBackward":
					case "deleteWordBackward":
						exports.web_text_key(0);
						break;
					case "deleteContentForward":
					case "deleteWordForward":
						exports.web_text_key(1);
						break;
					case "insertLineBreak":
					case "insertParagraph":
						exports.web_text_key(2);
						break;
					default:
						return;
					}
					event.preventDefault();
					mobileTextInput.value = "";
				});
				mobileTextInput.addEventListener("input", (event) => {
					if (event.isComposing) return;
					sendMobileText(event.data ?? mobileTextInput.value);
					mobileTextInput.value = "";
				});
				exports._start();
				exports.main_start();
				void restoreProjectFiles();
				let appRunning = true;
				const flushWorkspace = () => {
					if (appRunning) exports.main_flush_workspace();
				};
				window.addEventListener("pagehide", flushWorkspace);
				document.addEventListener("visibilitychange", () => {
					if (document.visibilityState === "hidden") flushWorkspace();
				});

				let lastCssWidth = 0;
				let lastCssHeight = 0;
				let lastRenderScale = 0;
				const sendResize = () => {
					const cssWidth = Math.max(1, document.documentElement.clientWidth);
					const cssHeight = Math.max(1, document.documentElement.clientHeight);
					// DPR 3-4 canvases consume disproportionate GPU memory on mobile.
					// DPR 2 remains Retina-sharp while keeping WebKit's surface stable.
					const renderScale = Math.min(2, Math.max(0.1, window.devicePixelRatio || 1));
					if (cssWidth === lastCssWidth &&
						cssHeight === lastCssHeight &&
						renderScale === lastRenderScale) return;

					lastCssWidth = cssWidth;
					lastCssHeight = cssHeight;
					lastRenderScale = renderScale;
					canvas.style.width = `${cssWidth}px`;
					canvas.style.height = `${cssHeight}px`;
					// Raylib's web backend treats its window size as its framebuffer
					// size. Render in device pixels and keep CSS as the logical size.
					exports.web_window_size_changed(
						Math.max(1, Math.round(cssWidth * renderScale)),
						Math.max(1, Math.round(cssHeight * renderScale)),
						renderScale,
					);
				};
				window.addEventListener("resize", sendResize, true);
				sendResize();
				window.addEventListener("paste", (event) => {
					if (document.activeElement !== canvas) return;
					const text = event.clipboardData?.getData("text/plain");
					if (text === undefined) return;
					const data = textEncoder.encode(text);
					const ptr = exports.web_transfer_alloc(data.length);
					new Uint8Array(exports.memory.buffer, ptr, data.length).set(data);
					exports.web_clipboard_changed(ptr, data.length);
					event.preventDefault();
				});

				let updateInProgress = false;
				const updateApp = () => {
					if (!appRunning || updateInProgress) return;
					updateInProgress = true;
					sendResize();
					if (!exports.main_update()) {
						appRunning = false;
						exports.main_end();
						exports._end();
					}
					if (hasMobileKeyboard &&
						exports.web_wants_text_input() === 0 &&
						document.activeElement === mobileTextInput) {
						mobileTextInput.blur();
					}
					updateInProgress = false;
				};
				const updateTouchStart = () => {
					// ImGui publishes WantTextInput on the frame after InputText is
					// activated. Advance that frame while Safari still considers this
					// call part of the trusted touch gesture.
					updateApp();
					if (exports.web_wants_text_input() === 0) updateApp();
					if (exports.web_wants_text_input() !== 0 &&
						document.activeElement !== mobileTextInput) {
						mobileTextInput.value = "";
						mobileTextInput.focus({preventScroll: true});
					}
				};
				const frame = () => {
					updateApp();
					if (appRunning) window.requestAnimationFrame(frame);
				};
				// Run immediate-mode press/release frames after raylib's canvas event
				// handlers. The release frame remains on Safari's trusted event stack,
				// allowing ImGui actions to open a native file picker synchronously.
				for (const eventName of ["mousedown", "mouseup", "touchend"]) {
					window.addEventListener(eventName, updateApp, {passive: true});
				}
				canvas.addEventListener("touchstart", updateTouchStart, {passive: true});
				canvas.addEventListener("dragstart", (event) => event.preventDefault());
				canvas.addEventListener("touchmove", (event) => event.preventDefault(), {passive: false});
				window.requestAnimationFrame(frame);
			},
			canvas: document.getElementById("canvas"),
			print: (...args) => console.log(...args),
		};
	</script>
	{{{ SCRIPT }}}
</body>
</html>
